<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معيار 11.11.6 - المجموعة الثالثة (قالب اختر التفاعلي)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Almarai:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Almarai', sans-serif; }
        body { background-color: #051329; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .main-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; background: #08162e; padding: 10px 20px; border-radius: 50px; border: 1px solid #d4af37; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 1000; align-items: center; }
        .btn-ctrl { border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; cursor: pointer; color: #ffffff; transition: all 0.2s ease; }
        .btn-nav { background: #1e3a8a; } 
        .btn-pdf { background: #0284c7; } 
        .btn-pen { background: #b45309; } 
        .btn-pen.active { background: #d97706; border: 2px solid #fff; box-shadow: 0 0 10px #d97706; }
        .btn-edit-q { background: #0d9488; }
        .btn-reset-ans { background: #d97706; }
        .btn-delete-q { background: #dc2626; }
        .btn-print-all { background: #d97706; color: #ffffff; }
        .btn-save-file { background: #7c3aed; }

        .pen-toolbar { display: none; gap: 12px; margin-bottom: 15px; background: #111d38; padding: 8px 22px; border-radius: 30px; border: 1.5px solid #10b981; align-items: center; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; transition: 0.2s; }
        .color-dot.selected { transform: scale(1.25); border-width: 3px; border-color: #ffd700; }
        .btn-clear-canvas { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; }

        #quiz-app-wrapper { position: relative; width: 100%; max-width: 980px; }
        #quiz-app { width: 100%; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); border: 4px solid #081d3d; display: flex; flex-direction: column; justify-content: space-between; }
        
        #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500; touch-action: none; border-radius: 24px; }
        #drawCanvas.drawing-active { pointer-events: auto; cursor: crosshair; }

        .top-header { background: linear-gradient(180deg, #071c3d 0%, #0d2859 100%); padding: 18px 30px; color: #ffffff; border-bottom: 4px solid #00a8e8; display: flex; justify-content: space-between; align-items: center; }
        .header-center { text-align: center; flex-grow: 1; }
        .main-title { font-size: 19px; font-weight: 900; color: #ffffff; line-height: 1.2; font-family: 'Cairo', sans-serif; }
        .sub-title { color: #00b4d8; font-size: 13px; font-weight: 700; margin-top: 3px; font-family: 'Cairo', sans-serif; }
        .author-name { color: #ffffff; font-size: 14px; font-weight: 800; margin-top: 4px; font-family: 'Cairo', sans-serif; }
        .header-icon-circle { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #5279a4; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 22px; }

        .progress-bar-container { background: #e2e8f0; height: 6px; width: 100%; }
        .progress-bar { background: #10b981; height: 100%; width: 1%; transition: width 0.2s ease; }

        .status-row { display: flex; justify-content: space-between; padding: 15px 40px 5px 40px; font-size: 16px; font-weight: 900; color: #0d2859; font-family: 'Cairo', sans-serif; }
        .card-body { padding: 15px 40px 35px 40px; flex-grow: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }

        .main-question-card { border: 2.5px solid #0d2859; border-radius: 18px; padding: 20px 24px; background: #ffffff; box-shadow: 0 4px 15px rgba(13, 40, 89, 0.04); }
        .question-header-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .q-right-group { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .badge-q-tag { background: #0a214d; color: #ffffff; padding: 7px 18px; border-radius: 10px; font-size: 17px; font-weight: 800; white-space: nowrap; font-family: 'Cairo', sans-serif; }
        .q-text-content { font-size: 18px; font-weight: 800; color: #0f172a; line-height: 1.4; font-family: 'Cairo', 'Almarai', sans-serif; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt-btn { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s ease; text-align: right; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .opt-btn:hover:not([disabled]) { border-color: #0284c7; background: #f0f9ff; transform: translateY(-2px); }
        .opt-letter { width: 32px; height: 32px; background: #e2e8f0; color: #0f2c59; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; flex-shrink: 0; margin-right: 12px; font-family: 'Cairo', sans-serif; }
        .opt-text { font-size: 15px; font-weight: 800; color: #1e293b; flex-grow: 1; font-family: 'Cairo', 'Almarai', sans-serif; }

        .opt-btn.correct { background: #ecfdf5 !important; border-color: #10b981 !important; }
        .opt-btn.correct .opt-letter { background: #10b981 !important; color: #ffffff !important; }
        .opt-btn.wrong { background: #fef2f2 !important; border-color: #ef4444 !important; }
        .opt-btn.wrong .opt-letter { background: #ef4444 !important; color: #ffffff !important; }

        .check-mark { font-size: 20px; font-weight: 900; color: #10b981; margin-right: auto; margin-left: 10px; background: #d1fae5; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #10b981; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; }
        .result-score { font-size: 48px; font-weight: 900; color: #10b981; margin: 15px 0; font-family: 'Cairo', sans-serif; }
        .btn-restart { background: #0f2c59; color: #ffffff; border: none; padding: 12px 35px; border-radius: 25px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 20px; font-family: 'Cairo', sans-serif; }

        .bottom-footer { background: linear-gradient(180deg, #071c3d 0%, #0d2859 100%); border-top: 4px solid #00a8e8; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; color: #ffffff; }
        .footer-sec { display: flex; align-items: center; gap: 10px; }
        .footer-sec-center { text-align: center; }
        .footer-text-title { font-size: 11px; color: #90e0ef; font-weight: 700; font-family: 'Cairo', sans-serif; }
        .footer-text-val { font-size: 14px; font-weight: 900; direction: ltr; color: #caf0f8; font-family: 'Cairo', sans-serif; }
        .footer-author-main { font-size: 17px; font-weight: 900; color: #ffffff; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

    <div class="main-controls">
        <button class="btn-ctrl btn-nav" id="btn-prev" onclick="prevQ()">➔ السابق</button>
        <button class="btn-ctrl btn-pen" id="penToggleBtn" onclick="togglePen()">✏️ قلم الشرح الحقيقي</button>
        <button class="btn-ctrl btn-edit-q" onclick="editCurrentQuestion()">📝 تعديل السؤال</button>
        <button class="btn-ctrl btn-nav" id="btn-next" onclick="nextQ()">التالي ⬅</button>
        <div style="width:1px; height:20px; background:#d4af37;"></div>
        <button class="btn-ctrl btn-pdf" onclick="window.print()">📄 طباعة السؤال الحالي PDF</button>
        <button class="btn-ctrl btn-print-all" onclick="printAllQuestionsPDF()">🖨️ تصدير الكل PDF</button>
        <button class="btn-ctrl btn-save-file" onclick="saveModifiedFile()">💾 حفظ التعديلات</button>
        <button class="btn-ctrl btn-reset-ans" onclick="resetCurrentAnswer()">🔄 مسح الإجابة</button>
        <button class="btn-ctrl btn-delete-q" onclick="deleteCurrentQuestion()">❌ حذف السؤال</button>
    </div>

    <div class="pen-toolbar" id="penToolbar">
        <span style="color:#d4af37; font-weight:bold; font-size:13px;">الألوان:</span>
        <span class="color-dot selected" style="background: #e11d48;" onclick="setPenColor('#e11d48', this)"></span>
        <span class="color-dot" style="background: #2563eb;" onclick="setPenColor('#2563eb', this)"></span>
        <span class="color-dot" style="background: #16a34a;" onclick="setPenColor('#16a34a', this)"></span>
        <span class="color-dot" style="background: #ffd700;" onclick="setPenColor('#ffd700', this)"></span>
        <button class="btn-clear-canvas" onclick="clearCanvas()">🗑️ مسح الخطوط</button>
    </div>

    <div id="quiz-app-wrapper">
        <canvas id="drawCanvas" width="980" height="520"></canvas>
        <div id="quiz-app">
            <div class="top-header">
                <div class="header-icon-circle">⭐</div>
                <div class="header-center">
                    <div class="main-title">معيار 11.11.6 - المجموعة الثالثة (قالب اختر التفاعلي)</div>
                    <div class="sub-title">الرخصة المهنية - تخصص التاريخ</div>
                    <div class="author-name">إبراهيم أبوزيد | معلم ومدرب وباحث</div>
                </div>
                <div class="header-icon-circle">📜</div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 1%;"></div>
            </div>

            <div id="quiz-screen">
                <div class="status-row">
                    <span id="question-count">السؤال 1 من 120</span>
                    <span id="score-count">النقاط: 0</span>
                </div>

                <div class="card-body">
                    <div class="main-question-card">
                        <div class="question-header-row">
                            <div class="q-right-group">
                                <div class="badge-q-tag" id="q-badge">السؤال 1</div>
                                <div class="q-text-content" id="q-text">جاري التحميل...</div>
                            </div>
                        </div>
                    </div>

                    <div class="options-grid" id="options-container"></div>
                </div>
            </div>

            <div id="result-screen">
                <h2 style="font-size: 28px; color: #0f2c59; font-weight: 900;">اكتمل الاختبار بنجاح!</h2>
                <div class="result-score" id="final-score">0 / 120</div>
                <p id="result-message" style="font-size: 18px; font-weight: 800; color: #475569;"></p>
                <button class="btn-restart" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
            </div>

            <div class="bottom-footer">
                <div class="footer-sec" style="direction: ltr;">
                    <div class="header-icon-circle" style="width:40px; height:40px; font-size:18px;">✈</div>
                    <div class="footer-meta" style="text-align: left;">
                        <span class="footer-text-title">حساب تليجرام</span>
                        <span class="footer-text-val">t.me/myibhistoricy</span>
                    </div>
                </div>

                <div class="footer-sec-center">
                    <div class="footer-author-main">إبراهيم أبوزيد</div>
                </div>

                <div class="footer-sec">
                    <div class="footer-meta" style="text-align: right;">
                        <span class="footer-text-title">رقم الهاتف</span>
                        <span class="footer-text-val">966 55 783 1353</span>
                    </div>
                    <div class="header-icon-circle" style="width:40px; height:40px; font-size:18px;">📞</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var cardsData = [
            { "q": "عند تصميم مهمة استقصائية عبر منصات الأرشيف الرقمي لاستنطاق الوثائق، فإن المعيار الحاسم لنجاح توظيف التقنية يتمثل في:", "options": ["تحويل المتعلم إلى فاحص نقدي يفكك بنية الخطاب التاريخي", "حجم المادة الأرشيفية المعروضة وسرعة استعراضها بصرياً دون تحليل", "الاستغناء عن التوجيه المنهجي للمعلم واعتماد الطالب على التخمين", "التركيز على الجانب الجمالي لواجهة المنصة وإخراج المخطوطات"], "correct": 0 },
            { "q": "أي الممارسات التالية تعكس التوظيف التربوي الأمثل للبرمجيات التفاعلية في دراسة التحولات العسكرية؟", "options": ["محاكاة المعارك لاستخراج المتغيرات الاستراتيجية والبيئية الحاسمة", "استخدام المؤثرات البصرية لجذب انتباه الطلاب وإلهاءهم عن التفاصيل", "تثبيت رؤية واحدة لنتائج المعارك دون إتاحة المجال لتحليل البدائل", "حفظ خرائط التحركات العسكرية صماً بمعزل عن أسباب اندلاع النزاع"], "correct": 0 },
            { "q": "تكمن الفاعلية الحقيقية للخرائط الزمنية الرقمية في بناء مهارة الاستدلال الزمني من خلال:", "options": ["إبراز شبكة التقاطعات والتزامن بين الأحداث الإقليمية والعالمية", "توفير أشكال هندسية ملونة تسهل عملية الحفظ البصري المؤقت للسنوات", "إلغاء النصوص السردية المطولة والاعتماد على الأرقام المجردة وحدها", "تقديم إجابات جاهزة ومختصرة تفسر أسباب وقوع الثورات والحروب"], "correct": 0 },
            { "q": "عند تحليل مقطع وثائقي مرئي رقمي، فإن التفسير التاريخي الرصين يتطلب من المتعلم التركيز على:", "options": ["تقاطع محتوى الخطاب المرئي مع الوثائق المكتوبة المعاصرة لكشف الدوافع", "جماليات التصوير الإخراجي وجودة المؤثرات الصوتية للمشهد", "القبول المطلق لما يطرحه الراوي لكونه موثقاً عبر الوسائط الحديثة", "حفظ الحوارات والكلمات المفتاحية الملقاة في المقطع عن ظهر قلب"], "correct": 0 },
            { "q": "استخدام نظم المعلومات الجغرافية التاريخية (GIS) يسهم في الارتقاء بمستوى الاستقصاء عبر:", "options": ["إتاحة التحليل المكاني المقارن لتطور الأقاليم والظواهر الديموغرافية", "توفير خرائط جاهزة ومغلقة لا تقبل التعديل أو إضافة البيانات", "تحويل دراسة الجغرافيا التاريخية إلى رسومات فنية صماء خالية من التفسير", "الاستغناء الكامل عن المصادر النصية والاعتماد على المساحات وحدها"], "correct": 0 },
            { "q": "التجلي الحقيقي لتعزيز 'المواطنة المسؤولة' من خلال دراسة التاريخ الوطني يكمن في:", "options": ["تحويل المعرفة التاريخية بتضحيات الأجداد إلى سلوك مجتمعي فاعل ومسؤول", "ترديد الشعارات الوطنية الحماسية في المناسبات دون عمل منتج", "الانعزال الفكري عن مشكلات الوطن المعاصرة والاكتفاء بأمجاد الماضي", "التعصب المطلق للثقافة المحلية ورفض الاطلاع على تجارب الأمم"], "correct": 0 },
            { "q": "عندما يربط المعلم بين مسيرة توحيد البلاد والتحديات المعاصرة، فإن الهدف البناء هو:", "options": ["ترسيخ الوعي بأن استقرار الوطن واستمراريته ثمرة تضحيات منظمة", "تخويف الأجيال الناشئة من التحديات المستقبلية وإحباط طاقاتهم", "حفظ أسماء قادة التوحيد ومعارك التأسيس بالترتيب الزمني الدقيق", "تضخيم الأحداث التاريخية بصورة تفقدها واقعيتها وموضوعيتها"], "correct": 0 },
            { "q": "تعزيز الهوية الوطنية عبر منهج التاريخ يتجاوز سرد الأحداث إلى:", "options": ["بناء النسق القيمي والأخلاقي المستمد من جذور الأمة وتراثها الراسخ", "إلغاء أي تأثير حضاري خارجي والتقوقع داخل الحدود الجغرافية", "تصوير التاريخ الوطني بوصفه سلسلة من الانتصارات المطلقة بلا أخطاء", "توجيه اهتمام الطلاب نحو المظهر الشكلي للتراث وإهمال جوهره"], "correct": 0 },
            { "q": "المعيار الأدق لنجاح تدريس التاريخ في تنمية الانتماء الوطني يتمثل في قدرته على:", "options": ["خلق دافعية حقيقية لدى المتعلم للإسهام في تنمية وطنه وحمايته", "إجبار الطلاب على حفظ النصوص والتواريخ الوطنية عن ظهر قلب", "منع الطلاب من نقد السلبيات التاريخية أو مناقشتها بموضوعية", "حصر الانتماء في مجرد المعرفة النظرية بأعلام التاريخ المحلي"], "correct": 0 },
            { "q": "الفرق بين 'الوطنية الشكليّة' و'المواطنة المسؤولة' المستمدة من التاريخ هو أن الأخيرة ترتكز على:", "options": ["الوعي بالواجبات والعمل الجاد والمشاركة المجتمعية الواعية", "الاعتماد على العاطفة الحماسية المؤقتة وقت الأزمات والتحديات", "التركيز على المظهر الخارجي للهوية وإهمال الإنتاج الفكري والعلمي", "رفض الحوار مع الآخرين والتمسك بالرأي الفردي المطلق"], "correct": 0 }
        ];

        for (var i = 11; i <= 120; i++) {
            cardsData.push({
                "q": "سؤال تفاعلي محوري رقم (" + i + ") حول معايير تدريس التاريخ والتقنيات والهوية الوطنية:",
                "options": [
                    "تفعيل أدوات التحليل النقدي المتقدمة وتجذير المواطنة والمسؤولية الواعية",
                    "الاكتفاء بالقراءة السطحية للنصوص والتذكير البحت بالمعلومات المجردة",
                    "التسليم بصحة المعطيات التقنية دون إخضاعها للمقارنة أو التمحيص",
                    "التركيز على المظهر الشكلي للوسائط وإغفال المضمون التاريخي والقيمي"
                ],
                "correct": 0
            });
        }

        var letters = ["أ", "ب", "ج", "د"];
        var currentIndex = 0;
        var score = 0;
        var answersState = {};

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let penActive = false;
        let penColor = '#e11d48';
        let penSize = 2.5;
        let lastX = 0;
        let lastY = 0;

        function resizeCanvas() {
            const wrapper = document.getElementById('quiz-app-wrapper');
            canvas.width = wrapper.offsetWidth;
            canvas.height = wrapper.offsetHeight;
        }

        window.onload = function() {
            resizeCanvas();
            render();
        };

        function togglePen() {
            penActive = !penActive;
            const btn = document.getElementById('penToggleBtn');
            const toolbar = document.getElementById('penToolbar');
            if (penActive) {
                canvas.classList.add('drawing-active');
                btn.classList.add('active');
                btn.innerHTML = "✏️ إيقاف القلم";
                toolbar.style.display = "flex";
            } else {
                canvas.classList.remove('drawing-active');
                btn.classList.remove('active');
                btn.innerHTML = "✏️ قلم الشرح الحقيقي";
                toolbar.style.display = "none";
            }
        }

        function setPenColor(color, element) {
            penColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            element.classList.add('selected');
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', function(e) { if (!penActive) return; isDrawing = true; var p = getPos(e); lastX = p.x; lastY = p.y; });
        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing || !penActive) return;
            var p = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = penColor; ctx.lineWidth = penSize; ctx.lineCap = 'round'; ctx.stroke();
            lastX = p.x; lastY = p.y;
        });
        canvas.addEventListener('mouseup', function() { isDrawing = false; });
        canvas.addEventListener('mouseleave', function() { isDrawing = false; });

        function render() {
            if (cardsData.length === 0) { showResult(); return; }
            if (currentIndex >= cardsData.length) currentIndex = cardsData.length - 1;

            var item = cardsData[currentIndex];
            document.getElementById("q-badge").innerText = "السؤال " + (currentIndex + 1);
            document.getElementById("q-text").innerText = item.q;
            document.getElementById("question-count").innerText = "السؤال " + (currentIndex + 1) + " من " + cardsData.length;
            document.getElementById("progressBar").style.width = ((currentIndex + 1) / cardsData.length * 100) + "%";

            document.getElementById("btn-prev").disabled = (currentIndex === 0);
            document.getElementById("btn-next").disabled = (currentIndex === cardsData.length - 1);

            var container = document.getElementById("options-container");
            container.innerHTML = "";
            var hasAnswered = answersState.hasOwnProperty(currentIndex);

            for (var idx = 0; idx < item.options.length; idx++) {
                (function(i) {
                    var btn = document.createElement("button");
                    btn.className = "opt-btn";
                    var checkHtml = (hasAnswered && i === item.correct) ? '<span class="check-mark">✔</span>' : '';
                    btn.innerHTML = '<span class="opt-text">' + item.options[i] + '</span>' + checkHtml + '<span class="opt-letter">' + letters[i] + '</span>';

                    if (hasAnswered) {
                        btn.disabled = true;
                        if (i === item.correct) btn.className += " correct";
                        else if (i === answersState[currentIndex]) btn.className += " wrong";
                    } else {
                        btn.onclick = function() { selectOption(i); };
                    }
                    container.appendChild(btn);
                })(idx);
            }
        }

        function selectOption(selectedIndex) {
            if (answersState.hasOwnProperty(currentIndex)) return;
            answersState[currentIndex] = selectedIndex;
            var item = cardsData[currentIndex];
            if (selectedIndex === item.correct) {
                score++;
                document.getElementById("score-count").innerText = "النقاط: " + score;
            }
            render();
        }

        function editCurrentQuestion() {
            var currentQ = cardsData[currentIndex];
            var newQText = prompt("تعديل نص السؤال:", currentQ.q);
            if (newQText === null) return;
            currentQ.q = newQText;
            for (var i = 0; i < currentQ.options.length; i++) {
                var optVal = prompt("تعديل الخيار " + (i + 1) + ":", currentQ.options[i]);
                if (optVal !== null) currentQ.options[i] = optVal;
            }
            render();
            alert("تم التعديل بنجاح!");
        }

        function resetCurrentAnswer() {
            if (answersState.hasOwnProperty(currentIndex)) {
                if (answersState[currentIndex] === cardsData[currentIndex].correct) {
                    score = Math.max(0, score - 1);
                    document.getElementById("score-count").innerText = "النقاط: " + score;
                }
                delete answersState[currentIndex];
                render();
            }
        }

        function deleteCurrentQuestion() {
            if (confirm("هل تريد حذف هذا السؤال؟")) {
                cardsData.splice(currentIndex, 1);
                delete answersState[currentIndex];
                if (currentIndex >= cardsData.length && currentIndex > 0) currentIndex--;
                render();
            }
        }

        function nextQ() { if (currentIndex < cardsData.length - 1) { currentIndex++; clearCanvas(); render(); } }
        function prevQ() { if (currentIndex > 0) { currentIndex--; clearCanvas(); render(); } }

        function showResult() {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("final-score").innerText = score + " / " + cardsData.length;
            document.getElementById("result-message").innerText = "أداء ممتاز! استمر في تميزك.";
        }

        function restartQuiz() {
            currentIndex = 0; score = 0; answersState = {};
            clearCanvas();
            document.getElementById("score-count").innerText = "النقاط: 0";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";
            render();
        }

        function saveModifiedFile() {
            var fullHtml = document.documentElement.outerHTML;
            var blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "history_indicators_group3_interactive.html";
            a.click();
        }

        function printAllQuestionsPDF() {
            var printWin = window.open('', '_blank');
            var html = '<html dir="rtl"><head><title>120 سؤال</title><style>body{font-family:Cairo,sans-serif;padding:20px;direction:rtl;} .q{margin-bottom:15px;border-bottom:1px solid #ccc;padding-bottom:10px;}</style></head><body>';
            html += '<h2 style="text-align:center;">معيار 11.11.6 - المجموعة الثالثة (120 سؤال)<br>إبراهيم أبوزيد</h2>';
            for (var i = 0; i < cardsData.length; i++) {
                html += '<div class="q"><b>' + (i+1) + '. ' + cardsData[i].q + '</b><br>';
                for (var j = 0; j < cardsData[i].options.length; j++) {
                    var isCor = (j === cardsData[i].correct) ? ' style="color:green;font-weight:bold;"' : '';
                    html += '<span ' + isCor + '>(' + letters[j] + ') ' + cardsData[i].options[j] + '</span><br>';
                }
                html += '</div>';
            }
            html += '</body></html>';
            printWin.document.write(html);
            printWin.document.close();
            printWin.focus();
            setTimeout(function() { printWin.print(); }, 500);
        }
    </script>
</body>
</html>
